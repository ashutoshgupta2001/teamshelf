name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamshelf
          POSTGRES_PASSWORD: teamshelf
          POSTGRES_DB: teamshelf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teamshelf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://teamshelf:teamshelf@127.0.0.1:5432/teamshelf_test
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      CSRF_SECRET: ci-csrf-secret-at-least-32-characters
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run migrate
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
